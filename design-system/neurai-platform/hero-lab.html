<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeurAI hero lab — ten directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
/*
 * The hero lab (user round 7): the approved TEXT, ten different visual
 * treatments of the mind — ?v=1..10 renders one. Selection mockups: the
 * chosen direction gets the full production build. Style grounding per
 * ui-ux-pro-max catalog: 1 immersive-3D dust · 2 diagnostic/MRI · 3 holo
 * contour · 4 volumetric ink · 5 circuit-tech · 6 one-line minimalism ·
 * 7 typographic rain · 8 rim-lit eclipse · 9 cartographic constellation ·
 * 10 reactor-core sci-fi.
 */
:root {
  --bg: #05091C; --fg: #EFF4FF; --fg-muted: #92A6CC; --hud: #677FAE;
  --accent: #56B1FF; --accent-deep: #2E6BFF;
  --line: rgba(110,150,210,.22); --glow: rgba(86,150,255,.4);
  --mono: "SFMono-Regular", ui-monospace, Consolas, monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--fg); overflow: hidden; height: 100vh; }
#art { position: fixed; inset: 0; width: 100%; height: 100%; }
.hud {
  position: fixed; top: 0; left: 0; right: 0; height: 42px; z-index: 5;
  display: flex; align-items: center; gap: 26px; padding: 0 18px;
  font-family: var(--mono); font-size: 10px; letter-spacing: .14em; color: var(--hud);
  background: rgba(4,6,22,.55); border-bottom: 1px solid var(--line);
}
.hud .live { color: var(--fg); font-weight: 600; }
.hud .live::before { content: "● "; color: var(--accent); }
.copy { position: fixed; z-index: 4; left: 6vw; top: 50%; transform: translateY(-50%); max-width: 560px; }
.kicker { font-family: var(--mono); font-size: 12px; letter-spacing: .34em; color: var(--fg-muted); margin-bottom: 20px; }
.kicker::before { content: "> "; color: var(--accent); }
.kicker::after { content: " _"; opacity: .6; }
h1 { font-size: clamp(64px, 9vw, 132px); line-height: .95; letter-spacing: -0.04em; margin-bottom: 14px;
  background: linear-gradient(115deg, #F2ECFF 30%, #A274FF 68%, #6D3BF5 94%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 40px rgba(162,116,255,.28)); }
.lead { font-size: clamp(15px, 1.5vw, 18px); color: var(--fg-muted); font-weight: 300; }
.lead .t2 { display: block; color: var(--fg); font-weight: 600; }
.cta { margin-top: 38px; display: inline-flex; align-items: center; gap: 10px; padding: 15px 30px; border-radius: 10px;
  font-size: 15px; font-weight: 600; text-decoration: none; color: #05091C;
  background: linear-gradient(115deg, var(--accent), var(--accent-deep));
  box-shadow: 0 0 0 1px rgba(86,177,255,.5), 0 10px 40px rgba(46,107,255,.35); }
.tags { margin-top: 26px; display: flex; gap: 22px; flex-wrap: wrap;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .18em; color: var(--hud); }
.tags span::before { content: "• "; color: var(--accent); }
.variant-label { position: fixed; right: 18px; bottom: 16px; z-index: 5;
  font-family: var(--mono); font-size: 11px; letter-spacing: .2em; color: var(--accent);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; background: rgba(4,6,22,.6); }
</style>
</head>
<body>
<canvas id="art"></canvas>
<header class="hud"><span class="live">NEURAI_MONITOR&nbsp;// LIVE</span><span>NEURONS 86,000,000,000</span><span>FIRING 4.31 M/S</span><span>FOCUS SPECIMEN · WHOLE</span></header>
<div class="copy">
  <div class="kicker">ARRIVAL</div>
  <h1>NeurAI</h1>
  <p class="lead"><span>We build intelligence into the fabric of work.</span><span class="t2">Calls become knowledge. Meetings become memory.</span></p>
  <a class="cta" href="#">Enter the Platform →</a>
  <div class="tags"><span>SPECIMEN: NEURAI</span><span>STATE: AI-NATIVE</span><span>STATUS: MAPPING</span></div>
</div>
<div class="variant-label" id="vlabel"></div>

<script>
(function () {
  "use strict";
  const V = Math.max(1, Math.min(10, parseInt(new URLSearchParams(location.search).get("v") || "1", 10)));
  const NAMES = ["SPECIMEN DUST", "MRI DEPTH RINGS", "HOLO CONTOURS", "INK NEBULA", "CIRCUIT MIND",
                 "ONE LINE", "GLYPH RAIN", "ECLIPSE RIM", "STAR CHART", "REACTOR CORE"];
  document.getElementById("vlabel").textContent = `VARIANT ${String(V).padStart(2, "0")} — ${NAMES[V - 1]}`;

  const cv = document.getElementById("art");
  const ctx = cv.getContext("2d");
  const DPR = Math.min(devicePixelRatio || 1, 1.5);
  let W, H;
  function resize() { W = cv.width = innerWidth * DPR; H = cv.height = innerHeight * DPR; }
  resize();

  let s = 1234;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;

  /* ---------- the shared side-profile brain path ---------- */
  /* traced in a unit box: x -1..1 (front left, back right), y -1..1 (top -1) */
  function brainPath(c) {
    c.beginPath();
    c.moveTo(-0.86, 0.10);
    c.bezierCurveTo(-1.02, -0.22, -0.86, -0.62, -0.45, -0.78); // frontal dome
    c.bezierCurveTo(-0.10, -0.95, 0.42, -0.95, 0.68, -0.72);   // crown
    c.bezierCurveTo(0.94, -0.52, 1.02, -0.18, 0.90, 0.06);     // occipital
    c.bezierCurveTo(0.98, 0.26, 0.84, 0.50, 0.62, 0.50);       // into cerebellum top
    c.bezierCurveTo(0.68, 0.72, 0.42, 0.86, 0.26, 0.74);       // cerebellum
    c.bezierCurveTo(0.18, 0.88, 0.02, 0.88, 0.00, 0.72);       // under
    c.bezierCurveTo(-0.24, 0.76, -0.52, 0.64, -0.60, 0.42);    // temporal lobe
    c.bezierCurveTo(-0.80, 0.38, -0.94, 0.28, -0.86, 0.10);    // jaw back to front
    c.closePath();
  }
  /* the brain's frame on screen: right side of the viewport */
  function frame(c) {
    const scale = Math.min(W, H * 1.15) * 0.34;
    c.setTransform(scale, 0, 0, scale, W * 0.66, H * 0.52);
  }
  const inBrain = (x, y) => { frame(ctx); brainPath(ctx); const ok = ctx.isPointInPath((x * 1 + 0) , y, "nonzero"); ctx.setTransform(1,0,0,1,0,0); return ok; };

  /* ---------- shared backdrop: obsidian→midnight + stardust ---------- */
  function backdrop() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#04102E"); g.addColorStop(1, "#03040F");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 240; i++) {
      const x = rnd() * W, y = rnd() * H, r = rnd();
      ctx.fillStyle = `rgba(${180 + 40 * r},${195 + 30 * r},255,${0.08 + r * 0.5})`;
      ctx.beginPath(); ctx.arc(x, y, (r > 0.93 ? 1.8 : 0.9) * DPR, 0, 7); ctx.fill();
    }
  }
  const blue = (a) => `rgba(86,177,255,${a})`;
  const ice = (a) => `rgba(150,200,255,${a})`;
  const hot = (a) => `rgba(235,245,255,${a})`;

  /* sample a point inside the silhouette via rejection on the path */
  function samplePts(n, pad = 0) {
    frame(ctx); brainPath(ctx);
    const pts = [];
    const M = ctx.getTransform();
    while (pts.length < n) {
      const ux = rnd() * 2.2 - 1.1, uy = rnd() * 2 - 1;
      if (ctx.isPointInPath(ux * M.a + M.e, uy * M.d + M.f)) pts.push([ux, uy]);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    return pts;
  }
  function toScreen(ux, uy) {
    frame(ctx); const M = ctx.getTransform(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    return [ux * M.a + M.e, uy * M.d + M.f];
  }

  /* ---------- the ten treatments ---------- */
  const VARIANTS = {
    1: function dust() { // volumetric specimen (refined baseline)
      const pts = samplePts(9000);
      ctx.globalCompositeOperation = "lighter";
      for (const [ux, uy] of pts) {
        const [x, y] = toScreen(ux, uy);
        const edge = Math.abs(ux) + Math.abs(uy);
        const core = Math.exp(-((ux + 0.05) ** 2 + (uy + 0.05) ** 2) * 3.2);
        const a = 0.05 + 0.1 * rnd() + core * 0.5;
        ctx.fillStyle = core > 0.55 ? hot(a) : (rnd() > .5 ? blue(a) : ice(a * .8));
        ctx.beginPath(); ctx.arc(x, y, (0.7 + rnd() * 1.3 + core) * DPR, 0, 7); ctx.fill();
      }
    },
    2: function mri() { // nested depth rings + scanline
      ctx.globalCompositeOperation = "lighter";
      for (let k = 10; k >= 1; k--) {
        const sc = k / 10;
        frame(ctx); ctx.transform(sc, 0, 0, sc, 0.02 * (1 - sc), 0.03 * (1 - sc));
        brainPath(ctx); ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.strokeStyle = k === 10 ? ice(.8) : blue(0.10 + 0.05 * k);
        ctx.lineWidth = (k === 10 ? 2.2 : 1.1) * DPR;
        ctx.shadowColor = blue(.5); ctx.shadowBlur = 14 * DPR;
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
      const [sx, sy] = toScreen(-1.15, -0.1);
      const [ex] = toScreen(1.15, -0.1);
      const g = ctx.createLinearGradient(0, sy - 40 * DPR, 0, sy + 40 * DPR);
      g.addColorStop(0, blue(0)); g.addColorStop(.5, ice(.3)); g.addColorStop(1, blue(0));
      ctx.fillStyle = g; ctx.fillRect(sx, sy - 40 * DPR, ex - sx, 80 * DPR);
    },
    3: function holo() { // horizontal contour banding + light cone
      frame(ctx); brainPath(ctx); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.save(); frame(ctx); brainPath(ctx); ctx.setTransform(1,0,0,1,0,0); ctx.clip();
      ctx.globalCompositeOperation = "lighter";
      for (let uy = -1; uy < 1; uy += 0.045) {
        const [x1, y1] = toScreen(-1.2, uy), [x2] = toScreen(1.2, uy);
        const a = 0.16 + 0.3 * Math.abs(Math.sin(uy * 9));
        ctx.strokeStyle = uy % 0.18 < 0.045 ? ice(a) : blue(a * .7);
        ctx.lineWidth = 1.1 * DPR;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y1); ctx.stroke();
      }
      ctx.restore();
      // projector cone from below
      const [bx, by] = toScreen(0, 1.35);
      const [tx, ty] = toScreen(0, 0.2);
      const g = ctx.createLinearGradient(0, by, 0, ty);
      g.addColorStop(0, blue(.35)); g.addColorStop(1, blue(0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(bx - 30 * DPR, by); ctx.lineTo(bx + 30 * DPR, by);
      ctx.lineTo(bx + W * 0.16, ty); ctx.lineTo(bx - W * 0.16, ty); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.ellipse(bx, by, 60 * DPR, 10 * DPR, 0, 0, 7); ctx.fillStyle = ice(.5); ctx.fill();
    },
    4: function ink() { // volumetric fog
      ctx.save(); frame(ctx); brainPath(ctx); ctx.setTransform(1,0,0,1,0,0); ctx.clip();
      ctx.globalCompositeOperation = "lighter";
      for (let i = 0; i < 260; i++) {
        const ux = rnd() * 2 - 1, uy = rnd() * 2 - 1;
        const [x, y] = toScreen(ux * .95, uy * .9);
        const r = (30 + rnd() * 90) * DPR;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        const core = Math.exp(-((ux) ** 2 + (uy) ** 2) * 2);
        g.addColorStop(0, blue((0.02 + 0.05 * rnd()) * (1 + core * 2)));
        g.addColorStop(1, blue(0));
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
      }
      for (let i = 0; i < 40; i++) { // embers
        const [x, y] = toScreen((rnd() * 2 - 1) * .8, (rnd() * 2 - 1) * .75);
        ctx.fillStyle = hot(.5 + rnd() * .4);
        ctx.beginPath(); ctx.arc(x, y, (0.8 + rnd()) * DPR, 0, 7); ctx.fill();
      }
      ctx.restore();
    },
    5: function circuit() { // PCB mind
      ctx.save(); frame(ctx); brainPath(ctx); ctx.setTransform(1,0,0,1,0,0); ctx.clip();
      const step = 0.085;
      ctx.globalCompositeOperation = "lighter";
      for (let i = 0; i < 210; i++) {
        let ux = Math.round((rnd() * 2 - 1) / step) * step;
        let uy = Math.round((rnd() * 2 - 1) / step) * step;
        const bright = rnd() > 0.82;
        ctx.strokeStyle = bright ? ice(.85) : blue(.3);
        ctx.lineWidth = (bright ? 1.6 : 1) * DPR;
        ctx.beginPath();
        let [x, y] = toScreen(ux, uy); ctx.moveTo(x, y);
        const segs = 2 + Math.floor(rnd() * 3);
        for (let sgi = 0; sgi < segs; sgi++) {
          if (rnd() > .5) ux += step * (rnd() > .5 ? 1 : -1); else uy += step * (rnd() > .5 ? 1 : -1);
          [x, y] = toScreen(ux, uy); ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.fillStyle = bright ? hot(.9) : blue(.5);
        ctx.beginPath(); ctx.arc(x, y, (bright ? 2.4 : 1.4) * DPR, 0, 7); ctx.fill();
      }
      ctx.restore();
      frame(ctx); brainPath(ctx); ctx.setTransform(1,0,0,1,0,0);
      ctx.strokeStyle = blue(.5); ctx.lineWidth = 1.4 * DPR; ctx.stroke();
    },
    6: function oneline() { // a single elegant stroke
      frame(ctx); brainPath(ctx); ctx.setTransform(1,0,0,1,0,0);
      ctx.strokeStyle = ice(.9); ctx.lineWidth = 2 * DPR;
      ctx.shadowColor = blue(.7); ctx.shadowBlur = 22 * DPR; ctx.stroke();
      // one inner gyri line, hand-drawn feel
      ctx.beginPath();
      frame(ctx);
      ctx.moveTo(-0.62, 0.05);
      ctx.bezierCurveTo(-0.5, -0.4, -0.15, -0.15, -0.1, -0.5);
      ctx.bezierCurveTo(-0.05, -0.15, 0.3, -0.55, 0.4, -0.2);
      ctx.bezierCurveTo(0.48, 0.02, 0.6, -0.1, 0.7, 0.05);
      ctx.setTransform(1,0,0,1,0,0);
      ctx.strokeStyle = blue(.55); ctx.lineWidth = 1.4 * DPR; ctx.shadowBlur = 12 * DPR; ctx.stroke();
      ctx.shadowBlur = 0;
    },
    7: function glyphs() { // the mind as data
      ctx.save(); frame(ctx); brainPath(ctx); ctx.setTransform(1,0,0,1,0,0); ctx.clip();
      const chars = "01⋅∙10⟨⟩01∴01";
      ctx.font = `${11 * DPR}px Consolas, monospace`;
      for (let col = -1.05; col < 1.1; col += 0.062) {
        const head = rnd() * 2 - 1;
        for (let row = -1; row < 1; row += 0.052) {
          const [x, y] = toScreen(col, row);
          const d = Math.abs(row - head);
          const a = Math.max(0, 0.75 - d * 1.3) + 0.05;
          ctx.fillStyle = d < 0.06 ? hot(.95) : blue(a);
          ctx.fillText(chars[Math.floor(rnd() * chars.length)], x, y);
        }
      }
      ctx.restore();
    },
    8: function eclipse() { // rim-lit silhouette on a portal
      const [cx, cy] = toScreen(0.05, -0.05);
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.min(W, H) * 0.42);
      g.addColorStop(0, "rgba(140,190,255,.85)"); g.addColorStop(.55, "rgba(60,110,255,.3)"); g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, Math.min(W, H) * 0.42, 0, 7); ctx.fill();
      frame(ctx); brainPath(ctx); ctx.setTransform(1,0,0,1,0,0);
      ctx.fillStyle = "rgba(3,5,16,.97)"; ctx.fill();
      ctx.strokeStyle = hot(.95); ctx.lineWidth = 2.4 * DPR;
      ctx.shadowColor = ice(.9); ctx.shadowBlur = 26 * DPR; ctx.stroke();
      ctx.shadowBlur = 0;
    },
    9: function chart() { // cartography of a mind
      // coordinate ring
      const [cx, cy] = toScreen(0.03, -0.03);
      const R = Math.min(W, H) * 0.4;
      ctx.strokeStyle = blue(.25); ctx.lineWidth = 1 * DPR;
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.stroke();
      for (let a = 0; a < 360; a += 6) {
        const long = a % 30 === 0;
        const r1 = R - (long ? 14 : 7) * DPR;
        const x1 = cx + Math.cos(a * Math.PI / 180) * r1, y1 = cy + Math.sin(a * Math.PI / 180) * r1;
        const x2 = cx + Math.cos(a * Math.PI / 180) * R, y2 = cy + Math.sin(a * Math.PI / 180) * R;
        ctx.strokeStyle = blue(long ? .5 : .25);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      }
      const nodes = samplePts(26);
      ctx.globalCompositeOperation = "lighter";
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const d = Math.hypot(nodes[i][0] - nodes[j][0], nodes[i][1] - nodes[j][1]);
          if (d > 0.55 || rnd() > 0.4) continue;
          const [x1, y1] = toScreen(...nodes[i]), [x2, y2] = toScreen(...nodes[j]);
          ctx.strokeStyle = blue(.3); ctx.lineWidth = 1 * DPR;
          ctx.beginPath(); ctx.moveTo(x1, y1);
          ctx.quadraticCurveTo((x1 + x2) / 2, Math.min(y1, y2) - 20 * DPR, x2, y2); ctx.stroke();
        }
      }
      for (const [ux, uy] of nodes) {
        const [x, y] = toScreen(ux, uy);
        const big = rnd() > 0.6;
        ctx.fillStyle = big ? hot(.95) : ice(.7);
        ctx.beginPath(); ctx.arc(x, y, (big ? 3 : 1.8) * DPR, 0, 7); ctx.fill();
        if (big) { ctx.strokeStyle = blue(.5); ctx.beginPath(); ctx.arc(x, y, 7 * DPR, 0, 7); ctx.stroke(); }
      }
      frame(ctx); brainPath(ctx); ctx.setTransform(1,0,0,1,0,0);
      ctx.strokeStyle = blue(.35); ctx.setLineDash([6 * DPR, 5 * DPR]); ctx.lineWidth = 1.2 * DPR; ctx.stroke(); ctx.setLineDash([]);
    },
    10: function reactor() { // energy shells around a blinding core
      ctx.save(); frame(ctx); brainPath(ctx); ctx.setTransform(1,0,0,1,0,0); ctx.clip();
      ctx.globalCompositeOperation = "lighter";
      const [cx, cy] = toScreen(0, -0.02);
      for (let k = 1; k <= 7; k++) {
        ctx.strokeStyle = blue(0.5 - k * 0.055);
        ctx.lineWidth = (2.6 - k * 0.25) * DPR;
        ctx.beginPath();
        ctx.ellipse(cx, cy, k * 34 * DPR, k * 23 * DPR, -0.35 + k * 0.09, 0, 7);
        ctx.stroke();
      }
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 90 * DPR);
      g.addColorStop(0, hot(.95)); g.addColorStop(.25, ice(.6)); g.addColorStop(1, blue(0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, 90 * DPR, 0, 7); ctx.fill();
      ctx.restore();
      frame(ctx); brainPath(ctx); ctx.setTransform(1,0,0,1,0,0);
      ctx.strokeStyle = ice(.55); ctx.lineWidth = 1.6 * DPR;
      ctx.shadowColor = blue(.6); ctx.shadowBlur = 18 * DPR; ctx.stroke(); ctx.shadowBlur = 0;
    },
  };

  backdrop();
  ctx.globalCompositeOperation = "source-over";
  VARIANTS[V]();
})();
</script>
</body>
</html>
